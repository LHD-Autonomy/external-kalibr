#Accelerometers
accelerometer_noise_density: 1.0e-04   #Noise density (continuous-time)
accelerometer_random_walk:   2.0e-05   #Bias random walk

#Gyroscopes
gyroscope_noise_density:     1.0e-05   #Noise density (continuous-time)
gyroscope_random_walk:       2.0e-06   #Bias random walk

rostopic:                    /krio_ins/imu      #the IMU ROS topic
update_rate:                 17.38      #Hz (for discretization of the values above)